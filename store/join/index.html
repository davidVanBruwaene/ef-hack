<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the network</title>
<style>
  :root { color-scheme: light dark; --bg:#faf8f4; --ink:#1b1a17; --muted:#5e5a50; --line:#d9d4c7; --accent:#0f6b63; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14130f; --ink:#f3f0e8; --muted:#b3ad9f; --line:#35332b; --accent:#4fc3b3; --card:#1e1d18; } }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:420px; margin:0 auto; padding:28px 20px; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:0; font-size:26px; line-height:1.2; }
  p { margin:0; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:14px; color:var(--muted); }
  input { min-height:48px; padding:0 14px; border-radius:10px; border:1px solid var(--muted); background:var(--bg); color:var(--ink); font:inherit; font-size:18px; }
  button { min-height:48px; border-radius:12px; border:1px solid var(--muted); background:var(--card); color:var(--ink); font:inherit; font-weight:600; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:var(--bg); }
  button:disabled { opacity:.5; }
  .error { color:#b3261e; font-size:14px; min-height:1.4em; }
  .ok { color:var(--accent); font-weight:600; }
  pre { margin:0; white-space:pre-wrap; font-size:16px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1 id="title">Join the network</h1>
  <p id="sub"></p>

  <section class="card" id="form" hidden>
    <label>First name <input id="first" autocomplete="given-name"></label>
    <label>Last name <input id="last" autocomplete="family-name"></label>
    <button id="register" class="primary">Join with a passkey</button>
    <p style="text-align:center">Already a member?</p>
    <button id="login">Sign in with my passkey</button>
  </section>

  <section class="card" id="done" hidden>
    <div class="ok" id="doneMsg"></div>
    <p>Your passkey stays on this device. There is no password.</p>
    <div id="codes" hidden>
      <p><strong>Save these recovery codes.</strong> Each works once if you lose this device. They are not shown again.</p>
      <pre id="codelist"></pre>
    </div>
  </section>

  <div class="error" id="error" role="alert"></div>
</main>
<script>
const $ = (id) => document.getElementById(id)
const token = new URLSearchParams(location.search).get('i')
const err = (m) => { $('error').textContent = m || '' }
async function call(method, path, body) {
  const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined })
  return { status: r.status, body: await r.json().catch(() => null) }
}
const q = token ? '?invite=' + encodeURIComponent(token) : ''

;(async () => {
  if (!token) { $('sub').textContent = 'This link has no invitation. Scan the QR code again.'; return }
  const info = await call('GET', '/invite/' + encodeURIComponent(token))
  if (!info.body?.valid) { $('title').textContent = 'This invitation is no longer valid'; $('sub').textContent = 'Ask the person who shared it for a new QR code.'; return }
  $('title').textContent = info.body.kind === 'event' ? 'Join ' + info.body.name : info.body.from + ' invited you'
  $('sub').textContent = info.body.kind === 'event'
    ? 'Create your account to join the network. Your agent can then look people up, within what each person allows.'
    : 'Join the network and connect with ' + info.body.from + '.'
  $('form').hidden = false
})()

function finish(r, joined) {
  if (r.status === 410) return err('This invitation was used up or switched off. Ask for a new QR code.')
  if (r.status !== 200) return err('That did not work (' + (r.body?.error ?? r.status) + '). Try again.')
  $('form').hidden = true; $('done').hidden = false
  $('doneMsg').textContent = joined ? 'You are in the network.' : 'Welcome back. You are connected.'
  if (r.body?.recovery_codes) { $('codes').hidden = false; $('codelist').textContent = r.body.recovery_codes.join('\n') }
}
$('register').onclick = async () => {
  err('')
  try {
    const name = { first_name: $('first').value, last_name: $('last').value }
    let o = await call('POST', '/auth/register/options', name)
    if (o.status === 409 && o.body?.error === 'name_in_use') {
      if (!confirm(o.body.error_description + ' Create a separate account anyway?')) return err('Use Sign in with the passkey you made when you joined.')
      o = await call('POST', '/auth/register/options', { ...name, separate: true })
    }
    if (o.status !== 200) return err('Enter your first and last name.')
    const cred = await navigator.credentials.create({ publicKey: PublicKeyCredential.parseCreationOptionsFromJSON(o.body) })
    finish(await call('POST', '/auth/register/verify' + q, cred.toJSON()), true)
  } catch (e) { err(e.name === 'NotAllowedError' ? 'Cancelled.' : e.message) }
}
$('login').onclick = async () => {
  err('')
  try {
    const o = await call('POST', '/auth/login/options')
    const cred = await navigator.credentials.get({ publicKey: PublicKeyCredential.parseRequestOptionsFromJSON(o.body) })
    finish(await call('POST', '/auth/login/verify' + q, cred.toJSON()), false)
  } catch (e) { err(e.name === 'NotAllowedError' ? 'Cancelled.' : e.message) }
}
</script>
</body>
</html>
